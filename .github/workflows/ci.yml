name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile sources
        run: python -m compileall -q fun tests
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: Check diff formatting
        run: git diff --check

  windows-test:
    name: Windows Python 3.11
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile sources
        run: python -m compileall -q fun tests scripts
      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath windows-test.log
          $code = $LASTEXITCODE
          Write-Host "unittest_exit_code=$code"
          if ($code -ne 0) {
            Write-Host "--- FAILED OR ERRORED TESTS ---"
            Select-String -Path windows-test.log -Pattern '^(FAIL|ERROR):' | Select-Object -First 100 | ForEach-Object { $_.Line }
            Write-Host "--- LAST TRACEBACK (tail) ---"
            Get-Content windows-test.log -Tail 220
          }
          if ($code -ne 0) { exit $code }
      - name: Upload Windows test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-log
          path: windows-test.log
          if-no-files-found: error
      - name: Run provider smoke fixture
        run: python -m unittest tests.test_agent_loop.AgentLoopTests.test_local_sse_provider_smoke_script -v

  build:
    name: Build package distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install "build>=1.2,<2"
      - name: Report build tooling
        run: |
          python --version
          python -m pip --version
          python -c "import setuptools; print('setuptools', setuptools.__version__)"
          python -c "import build; print('build', getattr(build, '__version__', 'unknown'))"
          python -m build --version
      - name: Report package version
        run: |
          python -c "import tomllib; print('project_version', tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          echo "commit=$GITHUB_SHA"
      - name: Build distributions
        run: python -m build
      - name: Generate distribution checksums
        run: |
          test -d dist
          shopt -s nullglob
          for unexpected in dist/*; do
            case "$unexpected" in
              dist/*.whl|dist/*.tar.gz|dist/SHA256SUMS) ;;
              *) echo "Unexpected distribution file: $unexpected"; exit 1 ;;
            esac
          done
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -gt 0
          test "${#sdists[@]}" -gt 0
          echo "wheel_count=${#wheels[@]} sdist_count=${#sdists[@]}"
          python - <<'PY'
          import pathlib
          import tarfile
          import tomllib
          import zipfile

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          name = project["name"].replace("-", "_")
          version = project["version"]
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          sdists = list(pathlib.Path("dist").glob("*.tar.gz"))
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  metadata = next(
                      item for item in archive.namelist()
                      if item.endswith(".dist-info/METADATA")
                  )
                  values = {
                      line.split(": ", 1)[1]
                      for line in archive.read(metadata).decode().splitlines()
                      if line.startswith("Version: ")
                  }
              if values != {version}:
                  raise SystemExit(f"Wheel metadata version mismatch: {wheel}")
          for sdist in sdists:
              with tarfile.open(sdist) as archive:
                  metadata = next(
                      item for item in archive.getnames()
                      if item.endswith("/PKG-INFO")
                  )
                  values = {
                      line.split(": ", 1)[1]
                      for line in archive.extractfile(metadata).read().decode().splitlines()
                      if line.startswith("Version: ")
                  }
              if values != {version}:
                  raise SystemExit(f"Sdist metadata version mismatch: {sdist}")
          print(f"validated_metadata={name}=={version}")
          PY
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: List built distributions
        run: ls -la dist
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: fun-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  package:
    name: Install package (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: fun-distributions
          path: dist
      - name: Verify distribution checksums
        run: (cd dist && sha256sum -c SHA256SUMS)
      - name: List downloaded distributions
        run: ls -la dist
      - name: Install wheel in isolated environment
        run: |
          python -m venv /tmp/fun-ci-venv
          /tmp/fun-ci-venv/bin/python -m pip install --upgrade pip
          /tmp/fun-ci-venv/bin/python -m pip --version
          /tmp/fun-ci-venv/bin/python -m pip install --no-index --no-deps dist/*.whl
          /tmp/fun-ci-venv/bin/python -c "import fun"
          /tmp/fun-ci-venv/bin/fun --help
      - name: Install sdist in isolated environment
        run: |
          python -m venv /tmp/fun-ci-sdist-venv
          /tmp/fun-ci-sdist-venv/bin/python -m pip install --upgrade pip
          /tmp/fun-ci-sdist-venv/bin/python -m pip install "setuptools>=68,<81" wheel
          /tmp/fun-ci-sdist-venv/bin/python --version
          /tmp/fun-ci-sdist-venv/bin/python -m pip --version
          /tmp/fun-ci-sdist-venv/bin/python -c "import setuptools, wheel; print('setuptools', setuptools.__version__); print('wheel', wheel.__version__)"
          sdists=(dist/*.tar.gz)
          test "${#sdists[@]}" -eq 1
          sdist="${sdists[0]}"
          echo "Installing sdist: $sdist"
          tar -tzf "$sdist" | sed -n '1,12p'
          rm -rf /tmp/fun-ci-sdist-wheel
          mkdir -p /tmp/fun-ci-sdist-wheel
          /tmp/fun-ci-sdist-venv/bin/python -m pip wheel --verbose --no-index --no-deps --no-build-isolation "$sdist" --wheel-dir /tmp/fun-ci-sdist-wheel
          wheels=(/tmp/fun-ci-sdist-wheel/*.whl)
          test "${#wheels[@]}" -eq 1
          echo "Installing rebuilt wheel: ${wheels[0]}"
          /tmp/fun-ci-sdist-venv/bin/python -m pip install --verbose --no-index --no-deps "${wheels[0]}"
          /tmp/fun-ci-sdist-venv/bin/python -c "import fun"
          /tmp/fun-ci-sdist-venv/bin/fun --help
