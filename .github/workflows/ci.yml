name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile sources
        run: python -m compileall -q fun tests
      - name: Run tests
        run: python -m unittest discover -s tests -q
      - name: Check diff formatting
        run: git diff --check

  build:
    name: Build package distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install "build>=1.2,<2"
      - name: Report build tooling
        run: python -m build --version
      - name: Build distributions
        run: python -m build
      - name: Generate distribution checksums
        run: (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: fun-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  package:
    name: Install package (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: fun-distributions
          path: dist
      - name: Verify distribution checksums
        run: (cd dist && sha256sum -c SHA256SUMS)
      - name: List downloaded distributions
        run: ls -la dist
      - name: Install wheel in isolated environment
        run: |
          python -m venv /tmp/fun-ci-venv
          /tmp/fun-ci-venv/bin/python -m pip install --upgrade pip
          /tmp/fun-ci-venv/bin/python -m pip install dist/*.whl
          /tmp/fun-ci-venv/bin/python -c "import fun"
          /tmp/fun-ci-venv/bin/fun --help
      - name: Install sdist in isolated environment
        run: |
          python -m venv /tmp/fun-ci-sdist-venv
          /tmp/fun-ci-sdist-venv/bin/python -m pip install --upgrade pip
          /tmp/fun-ci-sdist-venv/bin/python -m pip install dist/*.tar.gz
          /tmp/fun-ci-sdist-venv/bin/python -c "import fun"
          /tmp/fun-ci-sdist-venv/bin/fun --help
