name: Alpha Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish alpha release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install "build>=1.2,<2"
      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_TAG#v}"
          # The package version is the canonical PEP 440 value; requiring an
          # exact match rejects malformed or ambiguous tag spellings.
          actual=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test -n "$expected"
          test "$expected" = "$actual"
      - name: Build distributions
        run: python -m build
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: dist/*
