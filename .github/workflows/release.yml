name: Alpha Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: none

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish alpha release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install "build>=1.2,<2"
      - name: Report release identity
        run: |
          echo "tag=$GITHUB_REF_NAME"
          echo "commit=$GITHUB_SHA"
          git log -1 --format='commit=%H%nsubject=%s'
      - name: Verify release ref
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: test "$RELEASE_REF_TYPE" = "tag"
      - name: Verify tagged commit is on main
        run: |
          git rev-parse --verify "$GITHUB_SHA^{commit}"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - name: Report package version
        run: |
          python -c "import tomllib; print('project_version', tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          echo "commit=$GITHUB_SHA"
      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_TAG#v}"
          # The package version is the canonical PEP 440 value; requiring an
          # exact match rejects malformed or ambiguous tag spellings.
          actual=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test -n "$expected"
          test "$expected" = "$actual"
      - name: Build distributions
        run: python -m build
      - name: Verify distribution versions
        run: |
          test -d dist
          shopt -s nullglob
          for unexpected in dist/*; do
            case "$unexpected" in
              dist/*.whl|dist/*.tar.gz|dist/SHA256SUMS) ;;
              *) echo "Unexpected release artifact: $unexpected"; exit 1 ;;
            esac
          done
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -gt 0
          test "${#sdists[@]}" -gt 0
          echo "wheel_count=${#wheels[@]} sdist_count=${#sdists[@]}"
          python - <<'PY'
          import pathlib
          import tarfile
          import tomllib
          import zipfile

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          name = project["name"].replace("-", "_")
          version = project["version"]
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          sdists = list(pathlib.Path("dist").glob("*.tar.gz"))
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  metadata = next(item for item in archive.namelist() if item.endswith(".dist-info/METADATA"))
                  values = {line.split(": ", 1)[1] for line in archive.read(metadata).decode().splitlines() if line.startswith("Version: ")}
              if values != {version}:
                  raise SystemExit(f"Wheel metadata version mismatch: {wheel}")
          for sdist in sdists:
              with tarfile.open(sdist) as archive:
                  metadata = next(item for item in archive.getnames() if item.endswith("/PKG-INFO"))
                  values = {line.split(": ", 1)[1] for line in archive.extractfile(metadata).read().decode().splitlines() if line.startswith("Version: ")}
              if values != {version}:
                  raise SystemExit(f"Sdist metadata version mismatch: {sdist}")
          print(f"validated_metadata={name}=={version}")
          PY
      - name: Generate checksums
        run: |
          rm -f dist/SHA256SUMS
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -gt 0
          test "${#sdists[@]}" -gt 0
          echo "wheel_count=${#wheels[@]} sdist_count=${#sdists[@]}"
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: List release distributions
        run: ls -la dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: dist/*
