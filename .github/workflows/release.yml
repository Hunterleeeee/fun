name: Alpha Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: none

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish alpha release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install "build>=1.2,<2"
      - name: Verify release ref
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: test "$RELEASE_REF_TYPE" = "tag"
      - name: Verify tagged commit is on main
        run: |
          git rev-parse --verify "$GITHUB_SHA^{commit}"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="${RELEASE_TAG#v}"
          # The package version is the canonical PEP 440 value; requiring an
          # exact match rejects malformed or ambiguous tag spellings.
          actual=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test -n "$expected"
          test "$expected" = "$actual"
      - name: Build distributions
        run: python -m build
      - name: Verify distribution versions
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"].replace(".", "-"))')
          for artifact in dist/*.whl dist/*.tar.gz; do
            case "$artifact" in
              *"$version"*) ;;
              *) echo "Version mismatch: $artifact"; exit 1 ;;
            esac
          done
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: dist/*
